name: dotnet

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            7.0.x
            8.0.x

      - name: Restore
        run: dotnet restore DescagaCompronanteSRI.Tests/DescagaCompronanteSRI.Tests.csproj

      - name: Build
        run: dotnet build DescagaCompronanteSRI.Tests/DescagaCompronanteSRI.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test DescagaCompronanteSRI.Tests/DescagaCompronanteSRI.Tests.csproj --configuration Release --no-build --verbosity normal
